[project]
name = "ndltd-spider"
version = "0.1.0"
description = "臺灣博碩士論文知識加值系統 metadata 爬蟲工具"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "PyQt6>=6.6",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
