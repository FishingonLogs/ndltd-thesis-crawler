<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>安全驗證</title>
</head>
<body>
  <div class="captcha-box">
    <h2>請完成驗證</h2>
    <p>為保護系統安全，請輸入驗證碼後繼續。</p>
    <img id="captchaImage" src="/captcha/generate" alt="驗證碼圖片" />
    <label for="captchaInput">請輸入驗證碼：</label>
    <input type="text" id="captchaInput" name="captcha_code" />
    <button type="submit">確認</button>
  </div>
</body>
</html>
